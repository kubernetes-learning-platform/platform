name: node-ci

# Checks a TypeScript repo: its lint copies, Biome, the build and the types.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check. Empty means the event's commit, as on a PR.
        type: string
        default: ""
      node-version:
        description: The Node.js version to install.
        type: string
        default: "24"
      working-directory:
        description: The folder with package.json and package-lock.json.
        type: string
        default: .

permissions: {}

jobs:
  check:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the lint copies against platform
        working-directory: ${{ github.workspace }}
        env:
          PLATFORM: ${{ runner.temp }}/platform
        run: |
          commit="$(sed -n 's/^commit=//p' .lint-sync 2>/dev/null || true)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.lint-sync::No valid commit in .lint-sync. Run lint/sync.sh --node from platform to create it."
            exit 1
          fi
          git init -q "$PLATFORM"
          git -C "$PLATFORM" fetch -q --depth 1 https://github.com/kubernetes-learning-platform/platform.git "$commit"
          git -C "$PLATFORM" checkout -q FETCH_HEAD
          "$PLATFORM/lint/sync.sh" --check --node .

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and check formatting
        run: npm exec --no -- biome ci .

      - name: Build
        run: npm run build

      - name: Check types
        run: npm exec --no -- tsc --noEmit
