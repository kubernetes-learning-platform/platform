name: pr-title

# Fails a PR whose title isn't a Conventional Commit of at most 72 characters.
on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|refactor|perf|test|build|ci|chore|revert|style'
          pattern="^($types)(\([a-z0-9-]+\))?!?: [^ ](.*[^ .])?$"

          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title is not a Conventional Commit::Got \"$TITLE\". Use \"type: short description\", e.g. \"feat: add warm pool\". Types: ${types//|/, }. No period at the end."
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error title=PR title is too long::${#TITLE} characters, the limit is 72."
            exit 1
          fi
          echo "OK: $TITLE"
