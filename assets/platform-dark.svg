<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" class="sheet" role="img" aria-labelledby="st sd">
<title id="st">From a commit to the VM</title>
<desc id="sd">From a commit to the VM. Connections: contracts to proto-ci; sandbox to release-binary; sandbox to sandbox-template; api to container-publish; proto-ci to GitHub Packages; release-binary to GitHub Releases; sandbox-template to Sandbox template; container-publish to GHCR; GitHub Releases to On the host (deploy/vm); Sandbox template to On the host (linked clones); GHCR to The stack (manual deploy); Demo laptop to On the host.</desc>
<style>
.sheet{--paper:#16110A;--ink:#EDB95F;--soft:#B98C42;--fill:#211909;--grid:#4A3716;--pulse:#FFF3CF;}
.sheet{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.paper{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.inner{fill:none;stroke:var(--ink);stroke-width:.8}
.dot{fill:var(--grid)}
.group{fill:none;stroke:var(--soft);stroke-width:1.2;stroke-dasharray:7 5}
.mask{fill:var(--paper)}
.box{fill:var(--fill);stroke:var(--ink);stroke-width:1.5}
.box.ext{fill:var(--paper);stroke:var(--soft);stroke-dasharray:4 3}
.box.pane{fill:var(--paper)}
.bar{fill:var(--ink)}
.line,.hair{fill:none;stroke:var(--ink);stroke-width:1.2}
