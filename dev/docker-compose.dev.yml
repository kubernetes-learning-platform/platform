name: kubelab-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kubelab
      POSTGRES_USER: kubelab
      POSTGRES_PASSWORD: kubelab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubelab -d kubelab"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
